<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Windows 95 Portfolio</title>
    <meta
      name="description"
      content="A nostalgic Windows 95-themed portfolio website"
    />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./index-DYsDYwbg.css" />
    <style>
      @font-face {
        font-family: W95FA;
        src: url("./fonts/w95font.woff2") format("woff2"),
          url("./fonts/w95font.woff") format("woff");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: W95FA;
        src: url("./fonts/w95font-bold.woff2") format("woff2"),
          url("./fonts/w95font-bold.woff") format("woff");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }

      #root {
        position: relative;
      }

      #window-layer {
        position: absolute;
        inset: 0 0 40px 0;
        z-index: 20;
        pointer-events: none;
      }

      #desktop-icons {
        z-index: 5;
      }

      .window,
      .dialog-backdrop,
      .notification-container,
      .start-menu,
      .clippy-helper,
      .clippy-show-button {
        pointer-events: auto;
      }

      .helper-hidden {
        display: none !important;
      }

      .desktop-icon,
      .file-card,
      .image-file-tile,
      .window-button,
      .start-button,
      .taskbar-window,
      .start-menu-item,
      .sendmail-img-container {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="root" class="desktop">
      <div id="desktop-icons" class="desktop-icons"></div>
      <div id="window-layer"></div>
      <div id="notification-host"></div>
      <div id="dialog-host"></div>

      <div id="helper-panel" class="clippy-helper"></div>
      <button id="helper-show" class="clippy-show-button helper-hidden" type="button">
        📎
      </button>

      <div id="start-menu" class="start-menu helper-hidden">
        <div class="start-menu-sidebar">
          <div class="start-menu-title">Windows<span>95</span></div>
        </div>
        <div class="start-menu-items" id="start-menu-items"></div>
      </div>

      <div class="taskbar">
        <button id="start-button" class="start-button" type="button">
          <span class="start-logo">🪟</span>
          <span class="start-text">Start</span>
        </button>
        <div class="taskbar-separator"></div>
        <div id="taskbar-windows" class="taskbar-windows"></div>
        <div class="taskbar-tray">
          <div class="tray-icons">
            <span title="Portfolio">🌐</span>
            <span title="Messages">💬</span>
            <span title="Mail">📫</span>
          </div>
          <div id="taskbar-clock" class="taskbar-clock"></div>
        </div>
      </div>
    </div>
    <script src="./portfolio-app.js"></script>
  </body>
</html>
